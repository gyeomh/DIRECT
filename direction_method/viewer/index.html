<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>direction_method sweep viewer</title>
<style>
  :root {
    --bg: #f5f3ee;
    --panel: #ffffff;
    --border: #ddd7c9;
    --text: #24231f;
    --text-dim: #6b6759;
    --accent: #2b6f6a;
    --accent-dim: #cfe4e1;
    --good: #2f7d3a;
    --good-bg: #e5f2e3;
    --bad: #b23a34;
    --bad-bg: #fbe6e3;
    --warn: #a1731f;
    --warn-bg: #f7ecd6;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --panel: #202225;
      --border: #34363a;
      --text: #e7e5df;
      --text-dim: #9a978c;
      --accent: #5fb8b0;
      --accent-dim: #223b3a;
      --good: #6fcf7d;
      --good-bg: #1c3320;
      --bad: #f0847d;
      --bad-bg: #3a2020;
      --warn: #e0b05a;
      --warn-bg: #3a301a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --panel: #202225; --border: #34363a; --text: #e7e5df; --text-dim: #9a978c;
    --accent: #5fb8b0; --accent-dim: #223b3a; --good: #6fcf7d; --good-bg: #1c3320;
    --bad: #f0847d; --bad-bg: #3a2020; --warn: #e0b05a; --warn-bg: #3a301a;
  }
  :root[data-theme="light"] {
    --bg: #f5f3ee; --panel: #ffffff; --border: #ddd7c9; --text: #24231f; --text-dim: #6b6759;
    --accent: #2b6f6a; --accent-dim: #cfe4e1; --good: #2f7d3a; --good-bg: #e5f2e3;
    --bad: #b23a34; --bad-bg: #fbe6e3; --warn: #a1731f; --warn-bg: #f7ecd6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.45;
  }
  #app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }

  /* --- sidebar --- */
  #sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
  #sidebar-header { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
  #sidebar-header h1 { font-size: 15px; margin: 0 0 8px; letter-spacing: 0.01em; }
  #stats { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  select, input[type=text] {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 7px; font-size: 12px; font-family: var(--sans);
  }
  input[type=text] { flex: 1; min-width: 120px; }
  #record-list { flex: 1; overflow-y: auto; }
  .rec-row {
    display: flex; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer;
    border-bottom: 1px solid var(--border); font-size: 12.5px;
  }
  .rec-row:hover { background: var(--accent-dim); }
  .rec-row.selected { background: var(--accent-dim); border-left: 3px solid var(--accent); padding-left: 11px; }
  .rec-row .ep { font-variant-numeric: tabular-nums; color: var(--text-dim); width: 28px; flex-shrink: 0; }
  .rec-row .desc { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill {
    font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 999px; flex-shrink: 0;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }

  /* --- detail pane --- */
  #detail { overflow-y: auto; padding: 24px 32px 64px; }
  #detail.empty { display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin: 0 0 10px; }
  .header-card h1 { font-size: 20px; margin: 0 0 6px; text-wrap: balance; }
  .header-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12.5px; color: var(--text-dim); margin-top: 8px; }
  .header-meta b { color: var(--text); font-variant-numeric: tabular-nums; }
  .badges { display: flex; gap: 8px; margin-top: 10px; }

  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: 12.5px; }
  dl.kv dt { color: var(--text-dim); }
  dl.kv dd { margin: 0; }

  table.trace { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.trace th, table.trace td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.trace th { color: var(--text-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; }
  table.trace td.key { font-family: var(--mono); white-space: nowrap; color: var(--accent); }
  .verdict-yes { color: var(--good); font-weight: 600; }
  .verdict-no { color: var(--bad); font-weight: 600; }

  .checklist-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .checklist-cols pre { margin: 0; white-space: pre-wrap; font-family: var(--mono); font-size: 11.5px; }

  .candidate { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .candidate-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .candidate-header .idx { font-weight: 700; font-family: var(--mono); }
  .images-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .images-row figure { margin: 0; }
  .images-row img { max-width: 260px; max-height: 220px; border-radius: 6px; border: 1px solid var(--border); display: block; }
  .images-row figcaption { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .scene-line { font-size: 12px; color: var(--text-dim); margin: 6px 0; }
  .conclusion-line { font-size: 13px; margin-top: 8px; }

  code.small { font-family: var(--mono); font-size: 11px; background: var(--accent-dim); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>direction_method sweep viewer</h1>
      <div id="stats">loading…</div>
      <div class="filters">
        <select id="filter-type"><option value="">all types</option></select>
        <select id="filter-outcome">
          <option value="">all outcomes</option>
          <option value="success">full success</option>
          <option value="fail">not full success</option>
        </select>
        <input id="filter-search" type="text" placeholder="search description / episode id…">
      </div>
    </div>
    <div id="record-list"></div>
  </div>
  <div id="detail" class="empty">Select an episode-run on the left.</div>
</div>
<script>
let RECORDS = [];
let SELECTED_KEY = null;

async function loadRecords() {
  const res = await fetch('/api/records');
  RECORDS = await res.json();
  const types = [...new Set(RECORDS.map(r => r.task_type))].sort();
  const typeSel = document.getElementById('filter-type');
  for (const t of types) {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    typeSel.appendChild(opt);
  }
  renderStats();
  renderList();
}

function renderStats() {
  const total = RECORDS.length;
  const success = RECORDS.filter(r => r.full_success).length;
  const crashed = RECORDS.filter(r => r.outcome && r.outcome.includes('crash')).length;
  document.getElementById('stats').textContent =
    `${total} runs · ${success} full success (${(100*success/total).toFixed(1)}%) · ${crashed} crashed`;
}

function currentFilters() {
  return {
    type: document.getElementById('filter-type').value,
    outcome: document.getElementById('filter-outcome').value,
    search: document.getElementById('filter-search').value.trim().toLowerCase(),
  };
}

function filteredRecords() {
  const f = currentFilters();
  return RECORDS.filter(r => {
    if (f.type && r.task_type !== f.type) return false;
    if (f.outcome === 'success' && !r.full_success) return false;
    if (f.outcome === 'fail' && r.full_success) return false;
    if (f.search) {
      const hay = (r.target_description + ' ' + r.episode_id + ' ' + r.episode_idx).toLowerCase();
      if (!hay.includes(f.search)) return false;
    }
    return true;
  });
}

function outcomePill(r) {
  if (r.outcome && r.outcome.includes('crash')) return `<span class="pill bad">crash</span>`;
  if (r.full_success) return `<span class="pill good">ok</span>`;
  if (r.outcome === 'discarded_env_bug') return `<span class="pill warn">discard</span>`;
  return `<span class="pill bad">miss</span>`;
}

function renderList() {
  const list = document.getElementById('record-list');
  list.innerHTML = '';
  for (const r of filteredRecords()) {
    const row = document.createElement('div');
    row.className = 'rec-row' + (r.key === SELECTED_KEY ? ' selected' : '');
    row.innerHTML = `
      <span class="ep">${r.episode_idx}</span>
      ${outcomePill(r)}
      <span class="desc" title="${escapeHtml(r.target_description)}">${escapeHtml(r.target_description)}</span>
    `;
    row.addEventListener('click', () => selectRecord(r.key));
    list.appendChild(row);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function selectRecord(key) {
  SELECTED_KEY = key;
  renderList();
  const detail = document.getElementById('detail');
  detail.className = '';
  detail.innerHTML = '<div class="card">loading…</div>';
  const res = await fetch('/api/episode?key=' + encodeURIComponent(key));
  const record = await res.json();
  detail.innerHTML = renderDetail(record);
}

function imgTag(path, alt, extraClass) {
  if (!path) return `<div class="scene-line">(no image)</div>`;
  return `<figure><img src="/api/image?path=${encodeURIComponent(path)}" alt="${escapeHtml(alt)}" class="${extraClass||''}"><figcaption>${escapeHtml(alt)}</figcaption></figure>`;
}

function verdictSpan(v) {
  return `<span class="verdict-${v === 'yes' ? 'yes' : 'no'}">${escapeHtml(v)}</span>`;
}

function renderChecklist(checklist) {
  return JSON.stringify(checklist, null, 2);
}

function renderCandidate(c, idx) {
  const rows = (c.interactions || []).map(it => {
    if (it.type === 'checklist_check') {
      return `<tr><td class="key">${escapeHtml(it.parent_key)}</td><td>checklist</td>
        <td>${escapeHtml(it.assertion)}</td><td>${escapeHtml(it.region)}</td>
        <td>${verdictSpan(it.verdict)}</td><td>${escapeHtml(it.evidence)}</td></tr>`;
    }
    return `<tr><td class="key">${escapeHtml(it.relation)}</td><td>Q&amp;A</td>
      <td>${escapeHtml(it.question)}<br><i>${escapeHtml(it.answer || '')}</i></td>
      <td>${escapeHtml(it.region)}</td><td>${verdictSpan(it.verdict)}</td><td>${escapeHtml(it.evidence)}</td></tr>`;
  }).join('');

  const conclusionPill = c.conclusion === true
    ? `<span class="pill good">match</span>`
    : c.conclusion === false
      ? `<span class="pill bad">mismatch</span>`
      : `<span class="pill warn">unresolved</span>`;

  return `
    <div class="candidate">
      <div class="candidate-header">
        <span class="idx">candidate ${idx}</span>
        ${conclusionPill}
        <span style="color:var(--text-dim); font-size:12px;">${c.questions_asked} question(s) · ${c.self_check_calls} self_check call(s) · ${c.elapsed_s.toFixed(1)}s</span>
      </div>
      <div class="images-row">
        ${imgTag(c.raw_image_path, 'candidate image')}
        ${imgTag(c.boxed_image_path, 'zone_gen boxed image')}
      </div>
      ${c.scene ? `<div class="scene-line"><b>scene:</b> ${escapeHtml(c.scene)} &nbsp; <b>zones:</b> ${escapeHtml((c.zone_list||[]).join(', ') || '(none)')}</div>` : ''}
      <div class="checklist-cols">
        <div><h2 style="margin-bottom:4px;">checklist before</h2><pre>${escapeHtml(renderChecklist(c.checklist_before))}</pre></div>
        <div><h2 style="margin-bottom:4px;">checklist after</h2><pre>${escapeHtml(renderChecklist(c.checklist_after))}</pre></div>
      </div>
      <div class="conclusion-line"><b>conclusion:</b> ${escapeHtml(c.reasoning)}</div>
      ${rows ? `<table class="trace" style="margin-top:10px;">
        <thead><tr><th>key</th><th>kind</th><th>assertion / question</th><th>region</th><th>verdict</th><th>evidence</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : ''}
    </div>
  `;
}

function renderDetail(r) {
  const cp = r.context_parser || {};
  const otherObjects = (cp.other_objects || []).map(o =>
    `<code class="small">${escapeHtml(o.object)}</code> --${escapeHtml(o.cue)}--&gt; <code class="small">${escapeHtml(o.key)}</code>`
  ).join('<br>') || '<i>(none)</i>';

  const candidatesHtml = (r.candidates || []).map((c, i) => renderCandidate(c, i)).join('');

  return `
    <div class="card header-card">
      <h1>${escapeHtml(r.target_description)}</h1>
      <div>episode ${r.episode_idx} (${escapeHtml(r.episode_id)}) &middot; type <code class="small">${escapeHtml(r.task_type)}</code> &middot; category: ${escapeHtml(r.category)}</div>
      <div class="badges">
        ${outcomePill({outcome: r.outcome, full_success: r.full_success})}
        <span class="pill ${r.full_success ? 'good' : 'warn'}">${r.n_successes}/${r.n_distractors} correct</span>
      </div>
      <div class="header-meta">
        <span>outcome: <b>${escapeHtml(r.outcome)}</b></span>
        <span>questions: <b>${r.n_questions ?? '-'}</b></span>
        <span>candidates seen: <b>${r.candidates_seen ?? '-'}</b></span>
        <span>wall clock: <b>${r.wall_clock_s.toFixed(1)}s</b></span>
        <span>soft stop: <b>${r.soft_stop_fired}</b></span>
        <span>hard stop: <b>${r.hard_stop_fired}</b></span>
        ${r.error ? `<span style="color:var(--bad)">error: ${escapeHtml(r.error.split('\n')[0])}</span>` : ''}
      </div>
    </div>

    <div class="card">
      <h2>context_parser result</h2>
      <dl class="kv">
        <dt>target_category</dt><dd>${escapeHtml(cp.target_category || '')}</dd>
        <dt>target_phrase</dt><dd>${escapeHtml(cp.target_phrase || '')}</dd>
        <dt>other_objects</dt><dd>${otherObjects}</dd>
        <dt>validation_problems</dt><dd>${(cp.validation_problems||[]).join(', ') || '<i>(none)</i>'}</dd>
        <dt>retried</dt><dd>${cp.retried}</dd>
      </dl>
      <h2 style="margin-top:12px;">initial checklist</h2>
      <pre style="margin:0; font-family:var(--mono); font-size:11.5px; white-space:pre-wrap;">${escapeHtml(JSON.stringify(r.initial_checklist, null, 2))}</pre>
    </div>

    <div class="card">
      <h2>candidates (${(r.candidates||[]).length})</h2>
      ${candidatesHtml || '<i>none logged (crashed before first candidate concluded)</i>'}
    </div>
  `;
}

document.getElementById('filter-type').addEventListener('change', renderList);
document.getElementById('filter-outcome').addEventListener('change', renderList);
document.getElementById('filter-search').addEventListener('input', renderList);

loadRecords();
</script>
</body>
</html>
